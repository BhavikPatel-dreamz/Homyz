# Next.js app container only. Postgres, Redis, S3, and email stay EXTERNAL.
#
#   export HOMYZ_IMAGE=homyz:local   # or registry URI:tag
#   docker compose -f docker-compose.prod.yml up -d
#
# Bind 0.0.0.0:3000 so a cloud load balancer can reach the private NIC.
# After the LB is in front, close port 3000 in the security group (LB SG only).
# Runtime secrets: ./.env on the host (chmod 600). Never bake them into the image.
# DATABASE_URL is Neon now; switch to RDS later by editing .env and recreating.

name: homyz

services:
  app:
    image: ${HOMYZ_IMAGE:-homyz:local}
    container_name: homyz-app
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
