name: Deploy Homyz

on:
  push:
    branches: [main]

concurrency:
  group: deploy-homyz
  cancel-in-progress: false

env:
  VPS_APP_PATH: "/var/www/html/Homyz"
  PM2_PROCESS_NAME: "Homyz"

jobs:
  security-scan:
    name: Virus / malware scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run malware indicator + scanner
        run: |
          set -euo pipefail
          bash .githooks/pre-commit --ci
          echo "Security scan passed — build/deploy may continue."

  build:
    name: Build
    needs: security-scan
    if: ${{ needs.security-scan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/homyz
          NEXTAUTH_SECRET: github-actions-ci-secret
          JWT_ACCESS_SECRET: github-actions-ci-secret
          JWT_REFRESH_SECRET: github-actions-ci-secret
        run: npm run build

  deploy:
    name: Deploy
    needs: [security-scan, build]
    if: ${{ needs.security-scan.result == 'success' && needs.build.result == 'success' }}
    runs-on: [self-hosted]
    steps:
      - name: Capture Current Release
        run: |
          set -euo pipefail
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
            cd "${{ env.VPS_APP_PATH }}"
            PREV_SHA="$(git rev-parse HEAD 2>/dev/null || echo '')"
          else
            PREV_SHA=""
          fi
          echo "PREV_SHA=${PREV_SHA}" >> "$GITHUB_ENV"
          echo "Previous release: ${PREV_SHA:-<none, fresh clone>}"

      - name: Sync Code
        run: |
          set -euo pipefail
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
              cd "${{ env.VPS_APP_PATH }}"
              git remote set-url origin git@github.com:BhavikPatel-dreamz/Homyz.git
              git fetch origin
              git reset --hard "origin/main"
              git clean -fd
          else
              git clone -b main git@github.com:BhavikPatel-dreamz/Homyz.git "${{ env.VPS_APP_PATH }}"
          fi

      - name: Virus / malware scan (block server deploy if infected)
        id: malware_scan
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          if [ ! -f .githooks/pre-commit ]; then
            echo "Missing .githooks/pre-commit — refusing to deploy."
            exit 1
          fi
          bash .githooks/pre-commit --ci
          echo "Server security scan passed — continuing install/build."

      - name: Restore previous release after failed scan
        if: ${{ failure() && steps.malware_scan.outcome == 'failure' && env.PREV_SHA != '' }}
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          git reset --hard "${{ env.PREV_SHA }}"
          echo "Scan failed — working tree restored to ${PREV_SHA}. Deploy skipped."

      - name: Build
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          npm install
          npm run build

      - name: Start App
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          if pm2 list | grep -q "${{ env.PM2_PROCESS_NAME }}"; then
              pm2 restart "${{ env.PM2_PROCESS_NAME }}"
          else
              pm2 start npm --name "${{ env.PM2_PROCESS_NAME }}" -- start
          fi
          pm2 save
