name: Deploy Homyz

on:
  push:
    branches: [main]

concurrency:
  group: deploy-homyz
  cancel-in-progress: false

env:
  VPS_APP_PATH: "/var/www/html/Homyz"
  PM2_PROCESS_NAME: "Homyz"
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Virus / malware scan
        run: |
          set -euo pipefail
          bash .githooks/pre-commit --ci

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/homyz
          NEXTAUTH_SECRET: github-actions-ci-secret
          JWT_ACCESS_SECRET: github-actions-ci-secret
          JWT_REFRESH_SECRET: github-actions-ci-secret
          APP_URL: ${{ vars.APP_URL || 'http://localhost:3000' }}
          NEXTAUTH_URL: ${{ vars.APP_URL || 'http://localhost:3000' }}
        run: npm run build:ci

  migrate:
    name: Prisma migrate deploy
    needs: [validate]
    if: ${{ needs.validate.result == 'success' && vars.RUN_DB_MIGRATE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply migrations (non-destructive prisma migrate deploy only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate:deploy

  docker:
    name: Docker image → ECR
    needs: [validate]
    if: ${{ needs.validate.result == 'success' && vars.ECR_REPOSITORY != '' && vars.ECR_REGISTRY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          IMAGE="${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}"
          echo "image=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: |
            APP_URL=${{ vars.APP_URL }}
            NEXTAUTH_URL=${{ vars.APP_URL }}
            SERVER_ACTION_ALLOWED_ORIGINS=${{ vars.SERVER_ACTION_ALLOWED_ORIGINS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy EC2 (Docker)
    needs: [docker]
    if: ${{ needs.docker.result == 'success' && vars.ENABLE_DOCKER_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pull image and health-check switch
        env:
          SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOMYZ_IMAGE: ${{ needs.docker.outputs.image }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "EC2_SSH_HOST / EC2_SSH_USER / EC2_SSH_KEY required when ENABLE_DOCKER_DEPLOY=true"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          SSH=(ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}")
          SCP=(scp -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new)
          "${SSH[@]}" "mkdir -p /opt/homyz/scripts/deploy"
          "${SCP[@]}" scripts/deploy/release.sh scripts/deploy/rollback.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/homyz/scripts/deploy/"
          "${SCP[@]}" docker-compose.prod.yml "${SSH_USER}@${SSH_HOST}:/opt/homyz/"
          "${SSH[@]}" "chmod +x /opt/homyz/scripts/deploy/*.sh"
          "${SSH[@]}" "HOMYZ_IMAGE='${HOMYZ_IMAGE}' AWS_REGION='${AWS_REGION}' APP_DIR=/opt/homyz bash /opt/homyz/scripts/deploy/release.sh"

  deploy:
    name: Deploy (PM2 VPS)
    needs: [validate]
    if: ${{ needs.validate.result == 'success' && vars.ENABLE_DOCKER_DEPLOY != 'true' }}
    runs-on: [self-hosted]
    steps:
      - name: Capture Current Release
        run: |
          set -euo pipefail
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
            cd "${{ env.VPS_APP_PATH }}"
            PREV_SHA="$(git rev-parse HEAD 2>/dev/null || echo '')"
          else
            PREV_SHA=""
          fi
          echo "PREV_SHA=${PREV_SHA}" >> "$GITHUB_ENV"
          echo "Previous release: ${PREV_SHA:-<none, fresh clone>}"

      - name: Sync Code
        run: |
          set -euo pipefail
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
              cd "${{ env.VPS_APP_PATH }}"
              git remote set-url origin git@github.com:BhavikPatel-dreamz/Homyz.git
              git fetch origin
              git reset --hard "origin/main"
              git clean -fd
          else
              git clone -b main git@github.com:BhavikPatel-dreamz/Homyz.git "${{ env.VPS_APP_PATH }}"
          fi

      - name: Virus / malware scan (block server deploy if infected)
        id: malware_scan
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          if [ ! -f .githooks/pre-commit ]; then
            echo "Missing .githooks/pre-commit — refusing to deploy."
            exit 1
          fi
          bash .githooks/pre-commit --ci
          echo "Server security scan passed — continuing install/build."

      - name: Restore previous release after failed scan
        if: ${{ failure() && steps.malware_scan.outcome == 'failure' && env.PREV_SHA != '' }}
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          git reset --hard "${{ env.PREV_SHA }}"
          echo "Scan failed — working tree restored to ${PREV_SHA}. Deploy skipped."

      - name: Build on server
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          npm ci || npm install
          npm run build

      - name: Start App
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          if pm2 list | grep -q "${{ env.PM2_PROCESS_NAME }}"; then
              pm2 restart "${{ env.PM2_PROCESS_NAME }}"
          else
              pm2 start npm --name "${{ env.PM2_PROCESS_NAME }}" -- start -- -H 0.0.0.0 -p 3000
          fi
          pm2 save
