<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Circular background badge with pastel lavender/blue fill -->
  <defs>
    <path id="curve-text-coffee" d="M 30,105 A 70,70 0 0,1 170,105" fill="none" />
  </defs>
  
  <!-- Subtle circular stamp background -->
  <circle cx="100" cy="110" r="60" fill="#EDE7F6" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="100" cy="110" r="54" fill="#D1C4E9" opacity="0.4" />

  <!-- "stay like a homie." curved along top -->
  <text font-family="'Caveat', 'Comic Sans MS', cursive, sans-serif" font-size="14" fill="#1F1F1F" letter-spacing="1">
    <textPath href="#curve-text-coffee" startOffset="50%" text-anchor="middle">
      stay like a homie.
    </textPath>
  </text>

  <!-- Italian Moka Pot Sketch -->
  <g stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lid knob -->
    <circle cx="100" cy="58" r="3.5" fill="#1F1F1F" />
    <line x1="100" y1="61.5" x2="100" y2="65" stroke-width="2" />
    
    <!-- Lid triangle shape -->
    <path d="M78 74 L100 65 L122 74 Z" fill="#FFFFFF" />

    <!-- Top chamber (faceted Moka body) -->
    <path d="M78 74 L83 110 L117 110 L122 74 Z" fill="#FFFFFF" />
    <!-- Facet lines -->
    <line x1="91" y1="74" x2="93" y2="110" stroke-width="1.2" />
    <line x1="100" y1="74" x2="100" y2="110" stroke-width="1.2" />
    <line x1="109" y1="74" x2="107" y2="110" stroke-width="1.2" />

    <!-- Pouring Spout -->
    <path d="M78 75 L71 80 L79 84" />

    <!-- Handle -->
    <path d="M122 78 C136 78 136 102 120 106" stroke-width="3" />

    <!-- Center belt / screw ring -->
    <rect x="81" y="110" width="38" height="6" rx="1.5" fill="#E0E0E0" />

    <!-- Bottom Boiler (flared base) -->
    <path d="M83 116 L76 156 L124 156 L117 116 Z" fill="#FFFFFF" />
    <!-- Boiler facets -->
    <line x1="93" y1="116" x2="90" y2="156" stroke-width="1.2" />
    <line x1="100" y1="116" x2="100" y2="156" stroke-width="1.2" />
    <line x1="107" y1="116" x2="110" y2="156" stroke-width="1.2" />

    <!-- Safety valve -->
    <circle cx="83" cy="126" r="2" fill="#1F1F1F" />

    <!-- Base line -->
    <line x1="74" y1="156" x2="126" y2="156" stroke-width="2.5" />
  </g>

  <!-- Hand-drawn style "Coffee" underneath -->
  <text x="100" y="195" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="600" fill="#1F1F1F">
    Coffee
  </text>
</svg>

